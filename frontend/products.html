<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Senshop Products</title>

    <link rel="stylesheet" href="products.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <h2>SENSHOP</h2>

        </div>

        <ul>

            <li>
                <a href="home.html">
                    <i class="fas fa-house"></i>
                    Home
                </a>
            </li>

            <li class="active">
                <a href="#">
                    <i class="fas fa-box"></i>
                    Products
                </a>
            </li>

            <li>
                <a href="cart.html">
                    <i class="fas fa-cart-shopping"></i>
                    Cart
                </a>
            </li>

        


            <li>
                <a href="login.html">
                    <i class="fas fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <!-- Top Bar -->

        <header class="topbar">

            <h1>Products</h1>

            <div class="search">

                <input
                type="text"
                id="searchInput"
                placeholder="Search products...">

                <button>

                    <i class="fas fa-search"></i>

                </button>

            </div>

        </header>

        <!-- Categories -->

        <section class="categories">

            <button class="category-btn active">All</button>

            <button class="category-btn">Spray</button>

            <button class="category-btn">Bakery</button>

            <button class="category-btn">Dairy</button>

            <button class="category-btn">Groceries</button>

            <button class="category-btn">Electronics</button>

        </section>

        <!-- Products -->

        <section class="product-grid">

            <div class="product-card">

                <img src="c:\Users\Administrator\OneDrive\Pictures\sheenhairspray.jpg.jpg" alt="">

                <h3>Sheen Hair Spray</h3>

                <p class="category">spray

                </p>

                <p class="price">KSh 80</p>


                <button>Add To Cart</button>

            </div>

            <div class="product-card">

                <img src="https://via.placeholder.com/180" alt="">

                <h3>Milk</h3>

                <p class="category">Dairy</p>

                <p class="price">KSh  80</p>

                <button>Add To Cart</button>

            </div>

            <div class="product-card">

                <img src="https://via.placeholder.com/180" alt="">

                <h3>Bread</h3>

                <p class="category">Bakery</p>

                <p class="price">KSh 70</p>

        

                <button>Add To Cart</button>

            </div>

            <div class="product-card">

                <img src="https://via.placeholder.com/180" alt="">

                <h3>Sugar</h3>

                <p class="category">Groceries</p>

                <p class="price">KSh 180</p>



                <button>Add To Cart</button>

            </div>

            <div class="product-card">

                <img src="https://via.placeholder.com/180" alt="">

                <h3>Cooking Oil</h3>

                <p class="category">Groceries</p>

                <p class="price">KSh 350</p>


                <button>Add To Cart</button>

            </div>

            <div class="product-card">

                <img src="https://via.placeholder.com/180" alt="">

                <h3>Headphones</h3>

                <p class="category">Electronics</p>

                <p class="price">KSh 2,500</p>

                <button>Add To Cart</button>

            </div>

        </section>

    </main>

</div>

<script src="products.js"></script>

</body>

</html>
